name: Gemini TTS Debug APK

on:
  push:
    branches:
      - feature/gemini-tts-streaming
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gemini branch
        uses: actions/checkout@v4
        with:
          ref: feature/gemini-tts-streaming

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create secure TTS token configuration
        env:
          MAHAKAMA_TTS_TOKEN: ${{ secrets.MAHAKAMA_TTS_TOKEN }}
        run: |
          test -n "$MAHAKAMA_TTS_TOKEN" || {
            echo "MAHAKAMA_TTS_TOKEN repository secret is missing"
            exit 1
          }
          mkdir -p "$HOME/.config/mahakama"
          printf '%s' "$MAHAKAMA_TTS_TOKEN" > "$HOME/.config/mahakama/app_access_token"
          chmod 600 "$HOME/.config/mahakama/app_access_token"

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mahakama-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
